name: Build V3 No-Picker Bypass APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Complete Android Project
        run: |
          mkdir -p app/src/main/java/com/enderscope/htmlwallpaper
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/xml

          cat << 'EOF' > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "HTMLLockWallpaper"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins { id 'com.android.application' version '8.2.2' apply false }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.enderscope.htmlwallpaper'
              compileSdk 34
              defaultConfig {
                  applicationId "com.enderscope.htmlwallpaper"
                  minSdk 26
                  targetSdk 34
                  versionCode 3
                  versionName "3.0-Bypass"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:glEsVersion="0x00020000" android:required="true" />
              <uses-feature android:name="android.software.live_wallpaper" android:required="false" />
              <uses-permission android:name="android.permission.SET_WALLPAPER" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />

              <application
                  android:allowBackup="true"
                  android:label="HTML Gyro V3 Bypass"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">

                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".DirectLockActivity"
                      android:exported="true"
                      android:showOnLockScreen="true"
                      android:turnScreenOn="true"
                      android:launchMode="singleInstance"
                      android:excludeFromRecents="true"
                      android:theme="@style/Theme.AppCompat.DayNight.NoActionBar" />

                  <service
                      android:name=".LockGuardService"
                      android:enabled="true"
                      android:exported="false" />

                  <service
                      android:name=".GyroWallpaperService"
                      android:enabled="true"
                      android:exported="true"
                      android:label="3D Gyro LockScreen Pro"
                      android:permission="android.permission.BIND_WALLPAPER">
                      <intent-filter>
                          <action android:name="android.service.wallpaper.WallpaperService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.service.wallpaper"
                          android:resource="@xml/wallpaper" />
                  </service>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/xml/wallpaper.xml
          <?xml version="1.0" encoding="utf-8"?>
          <wallpaper xmlns:android="http://schemas.android.com/apk/res/android"
              android:settingsActivity="com.enderscope.htmlwallpaper.MainActivity" />
          EOF

          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
