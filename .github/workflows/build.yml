              <uses-feature android:name="android.software.live_wallpaper" android:required="false" />
              <uses-permission android:name="android.permission.SET_WALLPAPER" />
              <uses-permission android:name="android.permission.SET_WALLPAPER_COMPONENT" />
              <uses-permission android:name="android.permission.BIND_WALLPAPER" />

              <application
                  android:allowBackup="true"
                  android:label="HTML Gyro V5"
                  android:hardwareAccelerated="true"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">

                  <!-- Main Activity ALSO acts as System LiveWallpaperPicker Replacement! -->
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.service.wallpaper.CHANGE_LIVE_WALLPAPER" />
